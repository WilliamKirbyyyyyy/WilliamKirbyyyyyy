<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Will Kirby. Founder of Kirby Systems. Software that stays on your device.">
  <defs>
    <radialGradient id="p" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="rgba(255,168,118,0.60)"/><stop offset="1" stop-color="rgba(255,168,118,0.60)" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="rgba(140,182,255,0.55)"/><stop offset="1" stop-color="rgba(140,182,255,0.55)" stop-opacity="0"/></radialGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(14,17,22,0.05)"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0.2"/></linearGradient>
    <mask id="m"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <clipPath id="c"><rect width="1280" height="320" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="320" fill="#F6F7FA"/>
    <rect width="1280" height="320" fill="url(#g)" mask="url(#m)"/>
    <ellipse cx="1080" cy="40" rx="420" ry="300" fill="url(#p)"/>
    <ellipse cx="120" cy="300" rx="460" ry="280" fill="url(#b)"/>
    <ellipse cx="760" cy="330" rx="300" ry="160" fill="url(#p)" opacity=".6"/>

    <text x="72" y="92" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="15" letter-spacing="2.4" fill="#596070">KIRBY SYSTEMS · FOUNDER</text>
    <text x="66" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-4" fill="#0E1116">Will Kirby<tspan fill="#E0560A">.</tspan></text>
    <text x="72" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#3E4552">I build software that stays on <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#0E1116">your</tspan> device — private, local, fast.</text>

    <g transform="translate(866 118)">
      <rect width="340" height="84" rx="20" fill="rgba(255,255,255,0.72)" stroke="rgba(255,255,255,0.95)"/>
      <rect x="1" y="1" width="338" height="1.5" rx="1" fill="#fff" opacity="0.9"/>
      <circle cx="30" cy="42" r="6" fill="#16A34A"/>
      <circle cx="30" cy="42" r="11" fill="none" stroke="#16A34A" stroke-opacity=".25" stroke-width="4"/>
      <text x="54" y="37" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0E1116">RIVET 3.5 is live</text>
      <text x="54" y="60" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="13" letter-spacing="1" fill="#596070">ON THE MICROSOFT STORE</text>
    </g>
  </g>
</svg>
